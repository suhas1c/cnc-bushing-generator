<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CNC Lathe Bushing Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1100px; margin: 0 auto; }
        .panel { flex: 1; min-width: 320px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-row { margin-bottom: 12px; }
        label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px; font-size: 15px; font-weight: bold; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; background-color: #0056b3; }
        textarea { width: 100%; height: 500px; font-family: 'Courier New', Courier, monospace; font-size: 13px; padding: 10px; background-color: #1e1e1e; color: #d4d4d4; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: #0056b3;">Universal Fanuc Lathe Bushing Generator</h1>

    <div class="container">
        <!-- INPUT BOXES -->
        <div class="panel">
            <h2>Parameters</h2>
            <div class="form-row">
                <label>Bushing Type:</label>
                <select id="boxType" onchange="toggleFlange()">
                    <option value="plain">Plain Bushing</option>
                    <option value="flanged">Flanged Bushing</option>
                </select>
            </div>
            <div class="form-row"><label>Target OD (mm):</label><input type="number" id="boxOD" value="40.0" step="0.001"></div>
            <div class="form-row"><label>Target ID (mm):</label><input type="number" id="boxID" value="20.0" step="0.001"></div>
            <div class="form-row"><label>Raw Stock Dia (mm):</label><input type="number" id="boxStock" value="65.0" step="0.001"></div>
            <div class="form-row"><label>U-Drill Dia (mm):</label><input type="number" id="boxDrill" value="18.0" step="0.001"></div>
            <div class="form-row"><label>Total Length (mm):</label><input type="number" id="boxLength" value="50.0" step="0.001"></div>
            <div class="form-row"><label>45-Deg Chamfer (mm):</label><input type="number" id="boxChamfer" value="1.5" step="0.001"></div>
            <div class="form-row"><label>Flange Dia (mm):</label><input type="number" id="boxFlangeDia" value="60.0" step="0.001" disabled></div>
            <div class="form-row"><label>Flange Thickness (mm):</label><input type="number" id="boxFlangeThick" value="12.0" step="0.001" disabled></div>
            
            <button onclick="generateGCode()">Generate G-Code</button>
        </div>
        
        <!-- PREVIEW WINDOW -->
        <div class="panel">
            <h2>Live G-Code Preview</h2>
            <textarea id="boxPreview" readonly placeholder="Your G-code will print here..."></textarea>
        </div>
    </div>

    <script>
        function toggleFlange() {
            var isFlanged = document.getElementById("boxType").value === "flanged";
            document.getElementById("boxFlangeDia").disabled = !isFlanged;
            document.getElementById("boxFlangeThick").disabled = !isFlanged;
        }

        // Smart CNC math formatter helper
        function fmt(val) {
            var num = parseFloat(val.toFixed(3));
            var str = num.toString();
            if (str.indexOf('.') === -1) {
                return str + '.';
            }
            return str;
        }

        function generateGCode() {
            var pType = document.getElementById("boxType").value;
            var valOD = parseFloat(document.getElementById("boxOD").value);
            var valID = parseFloat(document.getElementById("boxID").value);
            var valStock = parseFloat(document.getElementById("boxStock").value);
            var valDrill = parseFloat(document.getElementById("boxDrill").value);
            var valLength = parseFloat(document.getElementById("boxLength").value);
            var valChamfer = parseFloat(document.getElementById("boxChamfer").value);
            var valFDia = parseFloat(document.getElementById("boxFlangeDia").value);
            var valFThick = parseFloat(document.getElementById("boxFlangeThick").value);

            if (valID >= valOD) { alert("Error: ID cannot be larger than OD!"); return; }
            if (valDrill >= valID) { alert("Error: Drill cannot be larger than finished ID!"); return; }

            var txtStockApproach = fmt(valStock + 2.0);
            var txtChamferStart = fmt(valOD - (2.0 * valChamfer));
            var txtOD = fmt(valOD);
            var txtID = fmt(valID);
            var txtDrill = fmt(valDrill);
            var txtChamferSize = fmt(valChamfer);
            var txtLength = fmt(valLength);
            var txtDrillDepth = fmt(valLength + 3.0);
            var txtStepZ = fmt(valLength - valFThick);
            var txtFDia = fmt(valFDia);
            var txtFThick = fmt(valFThick);

            var txt = "%\nO1007 (WEB BUSHING MACHINE);\n";
            
            if (pType === "plain") {
                txt += "(TYPE: PLAIN BUSHING);\n";
                txt += "(OD: " + txtOD + "mm, ID: " + txtID + "mm, LENGTH: " + txtLength + "mm);\n";
            } else {
                txt += "(TYPE: FLANGED BUSHING);\n";
                txt += "(OD: " + txtOD + "mm, ID: " + txtID + "mm, LENGTH: " + txtLength + "mm);\n";
                txt += "(FLANGE DIA: " + txtFDia + "mm, THICKNESS: " + txtFThick + "mm);\n";
            }
            
            txt += "G18 G21 G40 G99 G54;\n\n";

            // TOOL 1
            txt += "T0101 (OD ROUGH);\n";
            txt += "G50 S2000;\nG96 S180 M03;\n";
            txt += "G00 X" + txtStockApproach + " Z2. M08;\n";
            txt += "G01 Z0. F0.25;\nX-1.6 F0.15;\nG00 X" + txtStockApproach + " Z2.;\n\n";
            txt += "G71 U2. R0.5;\nG71 P10 Q20 U0.4 W0.1 F0.25;\n";

            if (pType === "plain") {
                txt += "N10 G00 G42 X" + txtChamferStart + ";\nG01 Z0. F0.15;\n";
                txt += "X" + txtOD + " Z-" + txtChamferSize + ";\nZ-" + txtLength + ";\nX" + txtStockApproach + ";\n";
            } else {
                txt += "N10 G00 G42 X" + txtChamferStart + ";\nG01 Z0. F0.15;\n";
                txt += "X" + txtOD + " Z-" + txtChamferSize + ";\nZ-" + txtStepZ + ";\nX" + txtFDia + ";\nZ-" + txtLength + ";\nX" + txtStockApproach + ";\n";
            }
            txt += "N20 G00 G40 Z2.;\nG28 U0. W0. M09;\nM05;\n\n";

            // TOOL 2
            txt += "T0202 (OD FINISH);\n";
            txt += "G50 S2200;\nG96 S220 M03;\n";
            txt += "G00 X" + txtStockApproach + " Z2. M08;\n";
            txt += "G70 P10 Q20 F0.12;\n";
            txt += "G28 U0. W0. M09;\nM05;\n\n";

            // TOOL 7
            txt += "T0707 (SPOT DRILL);\n";
            txt += "G97 S1200 M03;\n";
            txt += "G00 X0. Z3. M08;\n";
            txt += "G01 Z-4. F0.08;\n";
            txt += "G00 Z3.;\n";
            txt += "G28 U0. W0. M09;\nM05;\n\n";

            // TOOL 8
            txt += "T0808 (U-DRILL);\n";
            txt += "G97 S1000 M03;\n";
            txt += "G00 X0. Z5. M08;\n";
            txt += "G74 R1.;\n";
            txt += "G74 Z-" + txtDrillDepth + " Q5000 F0.1;\n";
            txt += "G00 Z5.;\n";
            txt += "G28 U0. W0. M09;\nM05;\n\n";

            // TOOL 9
            txt += "T0909 (BORING BAR);\n";
            txt += "G50 S2000;\nG96 S150 M03;\n";
            txt += "G00 X" + txtDrill + " Z2. M08;\n\n";
            txt += "G71 U1.5 R0.5;\nG71 P30 Q40 U-0.4 W0.05 F0.2;\n";
            
            var txtBoreChamferStart = fmt(valID + (2.0 * valChamfer));
            txt += "N30 G00 G41 X" + txtBoreChamferStart + ";\nG01 Z0. F0.1;\n";
            txt += "X" + txtID + " Z-" + txtChamferSize + ";\nZ-" + txtLength + ";\nX" + txtDrill + ";\n";
            txt += "N40 G00 G40 Z2.;\n\nG70 P30 Q40 F0.1;\nG28 U0. W0. M09;\nM05;\nM30;\n%\n";

            document.getElementById("boxPreview").value = txt;
        }
    </script>
</body>
</html>

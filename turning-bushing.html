<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Fanuc CNC Bushing Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .panel {
            flex: 1;
            min-width: 320px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .form-row {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:disabled {
            background-color: #e9ecef;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-gen { background-color: #0056b3; }
        .btn-dl { background-color: #28a745; }
        textarea {
            width: 100%;
            height: 520px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            padding: 10px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            box-sizing: border-box;
            resize: vertical;
        }
    </style>
</head>
<body>

    <a href="index.html" style="display: inline-block; margin-bottom: 15px; font-weight: bold; color: #0056b3; text-decoration: none;">← Back to Dashboard Hub</a>
    <h1 style="text-align: center; color: #0056b3;">Universal Fanuc Lathe Bushing Generator</h1>

    <div class="container">
        <!-- LEFT INPUT PANEL -->
        <div class="panel">
            <h2>Parameters</h2>
            
            <div class="form-row">
                <label>Bushing Type:</label>
                <select id="cmbType" onchange="toggleFlange()">
                    <option value="Plain Bushing">Plain Bushing</option>
                    <option value="Flanged Bushing">Flanged Bushing</option>
                </select>
            </div>

            <div class="form-row"><label>Target OD (mm):</label><input type="number" id="txtOD" value="40.0"></div>
            <div class="form-row"><label>Target ID (mm):</label><input type="number" id="txtID" value="20.0"></div>
            <div class="form-row"><label>Raw Stock Dia (mm):</label><input type="number" id="txtStock" value="65.0"></div>
            <div class="form-row"><label>U-Drill Dia (mm):</label><input type="number" id="txtDrill" value="18.0"></div>
            <div class="form-row"><label>Total Length (mm):</label><input type="number" id="txtLength" value="50.0"></div>
            <div class="form-row"><label>45-Deg Chamfer (mm):</label><input type="number" id="txtChamfer" value="1.5"></div>
            <div class="form-row"><label>Flange Dia (mm):</label><input type="number" id="txtFlangeDia" value="60.0" disabled></div>
            <div class="form-row"><label>Flange Thickness (mm):</label><input type="number" id="txtFlangeThick" value="12.0" disabled></div>

            <button class="btn-gen" onclick="runGenerator()">Generate Shop-Tool Macro</button>
            <button class="btn-dl" onclick="downloadNC()">Download .NC File</button>
        </div>

        <!-- RIGHT PREVIEW PANEL -->
        <div class="panel">
            <h2>Live Macro G-Code Preview</h2>
            <textarea id="txtPreview" readonly placeholder="Your macro program with specific tooling routes will appear here..."></textarea>
        </div>
    </div>

    <script>
        function toggleFlange() {
            var isFlanged = document.getElementById('cmbType').value === "Flanged Bushing";
            document.getElementById('txtFlangeDia').disabled = !isFlanged;
            document.getElementById('txtFlangeThick').disabled = !isFlanged;
        }

        function runGenerator() {
            var type = document.getElementById('cmbType').value;
            var od = parseFloat(document.getElementById('txtOD').value);
            var id = parseFloat(document.getElementById('txtID').value);
            var stock = parseFloat(document.getElementById('txtStock').value);
            var drill = parseFloat(document.getElementById('txtDrill').value);
            var len = parseFloat(document.getElementById('txtLength').value);
            var chamf = parseFloat(document.getElementById('txtChamfer').value);
            
            var fDia = !document.getElementById('txtFlangeDia').disabled ? parseFloat(document.getElementById('txtFlangeDia').value) : 0;
            var fThick = !document.getElementById('txtFlangeThick').disabled ? parseFloat(document.getElementById('txtFlangeThick').value) : 0;

            // Guardrails
            if (od <= 0 || id <= 0 || stock <= 0 || drill <= 0 || len <= 0 || chamf < 0) {
                alert("All standard dimensions must be greater than zero."); return;
            }
            if (id >= od) { alert("Inside Diameter cannot exceed Outside Diameter."); return; }
            if (drill >= id) { alert("Drill Diameter must be smaller than the finished internal hole."); return; }
            if (chamf >= (od - id) / 2.0) { alert("Chamfer is too large for this wall thickness."); return; }

            if (type === "Flanged Bushing") {
                if (fDia <= od) { alert("Flange Diameter must be larger than Bushing OD."); return; }
                if (fThick >= len) { alert("Flange Thickness cannot exceed Total Length."); return; }
                if (stock < fDia) { alert("Raw Stock must be equal to or larger than Flange Diameter."); return; }
            } else {
                if (stock < od) { alert("Raw Stock must be equal to or larger than Target OD."); return; }
            }

            // FIXED: Standard safe string structures throughout
            var sb = "%\nO1007 (FANUC VARIABLE BUSHING);\n";
            sb += "(-----------------------------------------);\n";
            sb += "(TYPE: " + type.toUpperCase() + ");\n";
            sb += "#101 = " + od.toFixed(3) + "  (TARGET OUTSIDE DIA - OD)\n";
            sb += "#102 = " + id.toFixed(3) + "  (TARGET INSIDE DIA - ID)\n";
            sb += "#103 = " + stock.toFixed(3) + "  (RAW STOCK DIA)\n";
            sb += "#104 = " + drill.toFixed(3) + "  (U-DRILL DIA)\n";
            sb += "#105 = " + len.toFixed(3) + "  (TOTAL BUSHING LENGTH)\n";
            sb += "#106 = " + chamf.toFixed(3) + "  (45-DEGREE CHAMFER SIZE)\n";
            if (type === "Flanged Bushing") {
                sb += "#107 = " + fDia.toFixed(3) + "  (FLANGE DIA)\n";
                sb += "#108 = " + fThick.toFixed(3) + "  (FLANGE THICKNESS)\n";
            }
            sb += "(-----------------------------------------);\n\n";
            
            sb += "G18 G21 G40 G99 G54;\n\n";
            
            // TOOL 1: OD Rough Turning (T0101)
            sb += "(--- TOOL 1: OD ROUGH TURNING ---);\n";
            sb += "T0101;\nG50 S2000;\nG96 S180 M03;\n";
            sb += "G00 X[#103 + 2.0] Z2.0 M08 (APPROACH SAFETY);\n";
            sb += "G01 Z0.0 F0.25;\nX-1.6 F0.15 (FACING PASS);\n";
            sb += "G00 X[#103 + 2.0] Z2.0;\n\n";
            sb += "G71 U2.0 R0.5;\n";
            sb += "G71 P10 Q20 U0.4 W0.1 F0.25 (ROUGH CYCLE SELECTION);\n";
            
            if (type === "Plain Bushing") {
                sb += "N10 G00 G42 X[#101 - [2.0 * #106]];\n";
                sb += "G01 Z0.0 F0.15;\n";
                sb += "X#101 Z-[#106];\n";
                sb += "Z-[#105];\n";
                sb += "X[#103 + 2.0];\n";
            } else {
                sb += "N10 G00 G42 X[#101 - [2.0 * #106]];\n";
                sb += "G01 Z0.0 F0.15;\n";
                sb += "X#101 Z-[#106];\n";
                sb += "Z-[#105 - #108];\n";
                sb += "X#107;\n";
                sb += "Z-[#105];\n";
                sb += "X[#103 + 2.0];\n";
            }
            sb += "N20 G00 G40 Z2.0;\n";
            sb += "G28 U0.0 W0.0 M09;\nM05;\n\n";

            // TOOL 2: OD Finish Turning (T0202)
            sb += "(--- TOOL 2: OD FINISH TURNING ---);\n";
            sb += "T0202;\nG50 S2200;\nG96 S220 M03;\n";
            sb += "G00 X[#103 + 2.0] Z2.0 M08;\n";
            sb += "G70 P10 Q20 F0.12 (FINISH PROFILE SWEEP);\n";
            sb += "G28 U0.0 W0.0 M09;\nM05;\n\n";

            // TOOL 7: Spot Drilling (T0707)
            sb += "(--- TOOL 7: SPOT DRILLING ---);\n";
            sb += "T0707;\nG97 S1200 M03 (FIXED RPM FOR CENTER PREP);\n";
            sb += "G00 X0.0 Z3.0 M08;\n";
            sb += "G01 Z-4.0 F0.08 (SPOT ENGAGEMENT);\n";
            sb += "G00 Z3.0;\n";
            sb += "G28 U0.0 W0.0 M09;\nM05;\n\n";

            // TOOL 8: U-Drilling (T0808)
            sb += "(--- TOOL 8: U-DRILLING ---);\n";
            sb += "T0808;\nG97 S1000 M03 (FIXED RPM DRILLING);\n";
            sb += "G00 X0.0 Z5.0 M08;\n";
            sb += "G74 R1.0;\n";
            sb += "G74 Z-[#105 + 3.0] Q5000 F0.1 (G74 PECK CORE);\n";
            sb += "G00 Z5.0;\n";
            sb += "G28 U0.0 W0.0 M09;\nM05;\n\n";

            // TOOL 9: ID Boring Bar (T0909)
            sb += "(--- TOOL 9: ID BORING BAR ---);\n";
            sb += "T0909;\nG50 S2000;\nG96 S150 M03;\n";
            sb += "G00 X" + drill + " Z2.0 M08 (RAPID POSITION INSIDE CORE);\n\n";

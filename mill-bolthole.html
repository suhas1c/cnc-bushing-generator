<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Bolt-Hole Circle Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .panel {
            flex: 1;
            min-width: 320px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .form-row {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-calc { background-color: #e0a800; color: #212529; }
        .btn-calc:hover { background-color: #c69500; }
        .btn-dl { background-color: #28a745; color: white; margin-top: 10px;}
        textarea {
            width: 100%;
            height: 440px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            padding: 10px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            box-sizing: border-box;
            resize: vertical;
        }
    </style>
</head>
<body>

    <a href="index.html" style="display: inline-block; margin-bottom: 15px; font-weight: bold; color: #0056b3; text-decoration: none;">← Back to Dashboard Hub</a>
    <h1 style="color: #c69500;">🌀 VMC Bolt-Hole Circle Grid Matrix</h1>

    <div class="container">
        <!-- LEFT INPUT PANEL -->
        <div class="panel">
            <h2>Pattern Parameters</h2>
            
            <div class="form-row"><label>Center X Coordinate (X0):</label><input type="number" id="txtCenterX" value="0.000"></div>
            <div class="form-row"><label>Center Y Coordinate (Y0):</label><input type="number" id="txtCenterY" value="0.000"></div>
            <div class="form-row"><label>Pitch Circle Diameter (PCD) mm:</label><input type="number" id="txtPCD" value="100.000"></div>
            <div class="form-row"><label>Number of Holes:</label><input type="number" id="txtHoles" value="6"></div>
            <div class="form-row"><label>Starting Angle (Degrees):</label><input type="number" id="txtStartAngle" value="0.0"></div>

            <div class="form-row">
                <label>Canned Cycle Mode:</label>
                <select id="cmbCycle">
                    <option value="G81">G81 (Standard Drilling)</option>
                    <option value="G83">G83 (Deep Peck Drilling)</option>
                </select>
            </div>

            <div class="form-row"><label>Drilling Depth (Z-):</label><input type="number" id="txtDepth" value="15.0"></div>
            <div class="form-row"><label>Feed Rate (F) mm/min:</label><input type="number" id="txtFeed" value="120"></div>

            <button class="btn-calc" onclick="calculateBoltCircle()">Generate VMC Matrix</button>
            <button class="btn-dl" onclick="downloadNC()">Download .NC File</button>
        </div>

        <!-- RIGHT OUTPUT PANEL -->
        <div class="panel">
            <h2>Live G-Code Preview</h2>
            <textarea id="txtGCode" readonly placeholder="Fanuc VMC drilling coordinates will generate here..."></textarea>
        </div>
    </div>

    <script>
        function calculateBoltCircle() {
            var cx = parseFloat(document.getElementById('txtCenterX').value);
            var cy = parseFloat(document.getElementById('txtCenterY').value);
            var pcd = parseFloat(document.getElementById('txtPCD').value);
            var numHoles = parseInt(document.getElementById('txtHoles').value);
            var startAngle = parseFloat(document.getElementById('txtStartAngle').value);
            var cycle = document.getElementById('cmbCycle').value;
            var depth = parseFloat(document.getElementById('txtDepth').value);
            var feed = parseFloat(document.getElementById('txtFeed').value);

            if (isNaN(cx) || isNaN(cy) || isNaN(pcd) || isNaN(numHoles) || pcd <= 0 || numHoles <= 0) {
                alert("Error: PCD and hole count must be greater than zero."); return;
            }

            var radius = pcd / 2.0;
            var angleIncrement = 360.0 / numHoles;

            var code = "%\nO2002 (VMC BOLT HOLE PATTERN);\n";
            code += "(PCD: " + pcd.toFixed(3) + "mm, HOLES: " + numHoles + ");\n";
            code += "G17 G21 G40 G80 G90;\n";
            code += "T04 M06 (SELECT DRILL);\n";
            code += "G54 G00 X" + cx.toFixed(3) + " Y" + cy.toFixed(3) + " S1200 M03;\n";
            code += "G43 H04 Z10.000 M08;\n\n";
            code += "(--- DRILLING PATTERN ---);\n";

            for (var i = 0; i < numHoles; i++) {
                var currentAngle = startAngle + (i * angleIncrement);
                var radians = currentAngle * (Math.PI / 180.0);

                // Math vectors forcing clean trailing decimal spaces
                var xPos = (cx + (radius * Math.cos(radians))).toFixed(3);
                var yPos = (cy + (radius * Math.sin(radians))).toFixed(3);

                if (i === 0) {
                    if (cycle === "G81") {
                        code += "G81 X" + xPos + " Y" + yPos + " Z-" + depth.toFixed(3) + " R2.000 F" + feed + ";\n";
                    } else {
                        code += "G83 X" + xPos + " Y" + yPos + " Z-" + depth.toFixed(3) + " Q4.000 R2.000 F" + feed + ";\n";
                    }
                } else {
                    code += "X" + xPos + " Y" + yPos + " (HOLE " + (i + 1) + ");\n";
                }
            }

            code += "G80 G00 Z25.000 M09;\n";
            code += "G28 G91 Z0.0;\nG90;\nM30;\n%\n";

            document.getElementById('txtGCode').value = code;
        }

        function downloadNC() {
            var text = document.getElementById('txtGCode').value;
            if (!text) { alert("Generate G-code first!"); return; }
            var blob = new Blob([text], { type: "text/plain" });
            var link = document.createElement("a");
            link.download = "VmcBoltCircle.nc";
            link.href = window.URL.createObjectURL(blob);
            link.click();
        }
    </script>
</body>
</html>
